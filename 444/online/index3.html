<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicación de Retorno</title>
    <style>
        /* Fondo gris claro y centrado absoluto en la pantalla */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Tarjeta contenedor (Ventana emergente) */
        .info-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Contenedor para el Logotipo superior */
        .logo-container {
            margin-bottom: 25px;
        }

        /* Estilo para la imagen del logo */
        .logo-container img {
            max-width: 150px;   /* Ajusta este valor según el tamaño de tu logo */
            height: auto;       /* Mantiene la proporción original */
            display: inline-block;
        }

        /* Icono visual (en este caso, un indicador de chat/atención) */
        .icon-container {
            margin-bottom: 20px;
            color: #25D366; /* Color representativo verde para alusión a mensajería */
        }

        /* Texto solicitado por el usuario */
        .message-text {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="info-card">

        <div class="logo-container">
            <img src="https://ubiionline.ubiipagos.com/LogoUbiiOnline.svg" alt="Logotipo de la empresa">
        </div>

        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 15c4.418 0 8-3.134 8-7s-3.582-7-8-7-8 3.134-8 7c0 1.76.743 3.37 1.97 4.6-.097.382-.41 1.412-.867 2.186a.25.25 0 0 0 .234.37c1.214-.118 2.241-.465 2.855-.707C4.743 14.73 6.32 15 8 15z"/>
            </svg>
        </div>

        <p class="message-text">Por favor regresa con el asesor que lo está atendiendo por vía WhatsApp.</p>

    </div>

</body>
</html>
